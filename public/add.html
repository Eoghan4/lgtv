<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Add a Movie 🎃</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0008;
      color: #ff6b00;
      font-family: 'Oswald', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    h1 {
      font-family: 'Creepster', cursive;
      font-size: 2.8rem;
      color: #ff6b00;
      text-shadow: 0 0 20px #ff6b0088;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 0.5rem;
      animation: flicker 5s infinite;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.6; }
      98% { opacity: 0.8; }
    }

    .subtitle {
      color: #ff6b0077;
      font-size: 1rem;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    form {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input[type="text"] {
      background: #1a0015;
      border: 2px solid #ff6b0066;
      border-radius: 10px;
      color: #ffeecc;
      font-family: 'Oswald', sans-serif;
      font-size: 1.3rem;
      padding: 1rem 1.2rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 1px;
    }

    input[type="text"]:focus {
      border-color: #ff6b00;
      box-shadow: 0 0 15px #ff6b0044;
    }

    input[type="text"]::placeholder {
      color: #ff6b0044;
    }

    button[type="submit"] {
      background: linear-gradient(135deg, #8b0000, #4a0066);
      border: 2px solid #ff6b00;
      border-radius: 10px;
      color: #ff6b00;
      font-family: 'Creepster', cursive;
      font-size: 1.8rem;
      letter-spacing: 3px;
      padding: 0.9rem;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 0 15px #ff6b0033;
    }

    button[type="submit"]:active {
      transform: scale(0.97);
    }

    button[type="submit"]:hover {
      box-shadow: 0 0 25px #ff6b0077;
    }

    .message {
      text-align: center;
      font-size: 1rem;
      letter-spacing: 1px;
      min-height: 1.5rem;
      margin-top: 0.5rem;
      transition: opacity 0.3s;
    }

    .message.success { color: #44ff88; }
    .message.error   { color: #ff4444; }

    .movie-list-section {
      margin-top: 2.5rem;
      width: 100%;
      max-width: 400px;
    }

    .movie-list-section h2 {
      font-family: 'Creepster', cursive;
      font-size: 1.6rem;
      color: #ff6b00;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 0.75rem;
    }

    .movie-list-section ul {
      list-style: none;
      background: #1a0015;
      border: 2px solid #ff6b0033;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      min-height: 48px;
    }

    .movie-list-section li {
      color: #ffcc88;
      font-size: 1rem;
      padding: 4px 0;
      border-bottom: 1px solid #ff6b0022;
      letter-spacing: 0.5px;
    }

    .movie-list-section li:last-child { border-bottom: none; }

    .empty-msg {
      color: #ff6b0044;
      font-size: 0.9rem;
      text-align: center;
      font-style: italic;
    }

    .count {
      text-align: center;
      font-size: 0.8rem;
      color: #ff6b0055;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>🎃 Add a Movie</h1>
  <p class="subtitle">Pick something spooky for the wheel!</p>

  <form id="addForm">
    <input
      type="text"
      id="titleInput"
      placeholder="Movie title..."
      maxlength="50"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      required
    >
    <button type="submit">ADD TO WHEEL 🕸️</button>
    <div class="message" id="message"></div>
  </form>

  <div class="movie-list-section">
    <h2>⚰️ On the Wheel ⚰️</h2>
    <ul id="movieList">
      <li class="empty-msg">No movies yet...</li>
    </ul>
    <div class="count" id="movieCount"></div>
  </div>

  <script>
    let movies = [];

    const ws = new WebSocket(`wss://${location.host}`);
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'movies') {
        movies = data.movies;
        renderList();
      }
    };

    function renderList() {
      const ul = document.getElementById('movieList');
      const count = document.getElementById('movieCount');
      if (movies.length === 0) {
        ul.innerHTML = '<li class="empty-msg">No movies yet...</li>';
        count.textContent = '';
      } else {
        ul.innerHTML = movies.map(m => `<li>👻 ${escapeHtml(m)}</li>`).join('');
        count.textContent = `${movies.length} / 10`;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = `message ${type}`;
      setTimeout(() => { el.textContent = ''; el.className = 'message'; }, 3000);
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('titleInput');
      const title = input.value.trim();
      if (!title) return;

      try {
        const res = await fetch('/api/movies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        const data = await res.json();
        if (res.ok) {
          showMessage(`"${title}" added! 🎃`, 'success');
          input.value = '';
        } else {
          showMessage(data.error || 'Something went wrong', 'error');
        }
      } catch {
        showMessage('Could not reach the server', 'error');
      }
    });
  </script>
</body>
</html>
