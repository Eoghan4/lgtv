<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Halloween Movie Wheel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0008;
      color: #ff6b00;
      font-family: 'Oswald', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Stars background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, #fff8 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 50%, #fff6 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, #fff8 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, #fff5 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 30%, #fff8 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 85%, #fff6 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 60%, #fff7 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 70%, #fff6 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      font-family: 'Creepster', Georgia, serif;
      font-size: 3.5rem;
      color: #ff6b00;
      text-shadow: 0 0 20px #ff6b0088, 0 0 40px #ff6b0044;
      letter-spacing: 4px;
      margin-bottom: 1rem;
      z-index: 1;
      animation: flicker 4s infinite;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.7; }
      97% { opacity: 1; }
      98% { opacity: 0.5; }
      99% { opacity: 1; }
    }

    .main-layout {
      display: flex;
      align-items: center;
      gap: 3rem;
      z-index: 1;
    }

    /* Wheel container */
    .wheel-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-pointer {
      position: absolute;
      right: -28px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-right: 44px solid #ff6b00;
      filter: drop-shadow(0 0 8px #ff6b00);
      z-index: 10;
    }

    canvas {
      border-radius: 50%;
      box-shadow: 0 0 40px #ff6b0066, 0 0 80px #ff6b0022;
    }

    .wheel-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ff6b00, #8b0000);
      border-radius: 50%;
      border: 3px solid #ff6b00;
      box-shadow: 0 0 15px #ff6b00;
      z-index: 5;
    }

    /* Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .qr-box {
      background: #1a0015;
      border: 2px solid #ff6b0066;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 0 20px #ff6b0033;
    }

    .qr-box p {
      font-size: 0.9rem;
      color: #ff9944;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .qr-box img {
      border-radius: 8px;
      display: block;
    }

    .qr-url {
      font-size: 0.75rem;
      color: #ff6b0088;
      margin-top: 0.5rem;
      letter-spacing: 0px;
    }

    .movie-list {
      background: #1a0015;
      border: 2px solid #ff6b0066;
      border-radius: 12px;
      padding: 1rem;
      width: 240px;
      box-shadow: 0 0 20px #ff6b0033;
    }

    .movie-list h3 {
      font-family: 'Creepster', Georgia, serif;
      font-size: 1.4rem;
      color: #ff6b00;
      text-align: center;
      margin-bottom: 0.75rem;
      letter-spacing: 2px;
    }

    .movie-list ul {
      list-style: none;
      min-height: 40px;
    }

    .movie-list li {
      color: #ffcc88;
      font-size: 0.9rem;
      padding: 3px 0;
      border-bottom: 1px solid #ff6b0022;
      letter-spacing: 0.5px;
    }

    .empty-msg {
      color: #ff6b0055;
      font-size: 0.85rem;
      text-align: center;
      font-style: italic;
      padding: 0.5rem 0;
    }

    .movie-count {
      text-align: center;
      font-size: 0.8rem;
      color: #ff6b0066;
      margin-top: 0.5rem;
    }

    #clearBtn {
      display: block;
      width: 100%;
      margin-top: 0.75rem;
      background: transparent;
      border: 1px solid #ff6b0055;
      border-radius: 8px;
      color: #ff6b0088;
      font-family: 'Oswald', Arial, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 0.5rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }

    #clearBtn:hover, #clearBtn:focus {
      border-color: #ff6b00;
      color: #ff6b00;
      box-shadow: 0 0 10px #ff6b0044;
      outline: none;
    }

    /* Result overlay */
    .result-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .result-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .result-overlay h2 {
      font-family: 'Creepster', Georgia, serif;
      font-size: 2.5rem;
      color: #ff9900;
      letter-spacing: 3px;
      margin-bottom: 1rem;
      text-shadow: 0 0 30px #ff6b00;
    }

    .result-title {
      font-family: Georgia, serif;
      font-size: 5rem;
      color: #ff6b00;
      text-shadow: 0 0 40px #ff6b00, 0 0 80px #ff6b0066;
      text-align: center;
      padding: 0 2rem;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 40px #ff6b00, 0 0 80px #ff6b0066; }
      to   { text-shadow: 0 0 60px #ff6b00, 0 0 120px #ff6b00aa; }
    }

    .result-hint {
      margin-top: 2rem;
      font-size: 1rem;
      color: #ff6b0077;
      letter-spacing: 2px;
    }

    /* Bats */
    .bat {
      position: fixed;
      font-size: 1.5rem;
      animation: fly linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fly {
      from { transform: translateX(-80px) translateY(0px); }
      25%  { transform: translateX(25vw)  translateY(-40px); }
      50%  { transform: translateX(50vw)  translateY(20px); }
      75%  { transform: translateX(75vw)  translateY(-20px); }
      to   { transform: translateX(110vw) translateY(10px); }
    }

    /* Hint bar */
    .hint-bar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      color: #ff6b0077;
      letter-spacing: 2px;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Bats -->
  <div class="bat" style="top:10%; animation-duration:14s; animation-delay:0s;">~</div>
  <div class="bat" style="top:25%; animation-duration:18s; animation-delay:5s;">~</div>
  <div class="bat" style="top:60%; animation-duration:12s; animation-delay:2s;">~</div>
  <div class="bat" style="top:80%; animation-duration:20s; animation-delay:9s;">~</div>

  <h1>Eve & Eoghan's Spooky Scary Slimefest</h1>

  <div class="main-layout">
    <div class="sidebar">
      <div class="qr-box">
        <p>SCAN TO ADD A MOVIE</p>
        <img id="qrImg" src="/qr.png" alt="QR Code" width="180" height="180">
        <div class="qr-url">movie.eoghanmcgough.com/add</div>
      </div>

      <div class="movie-list">
        <h3>-- The Lineup --</h3>
        <ul id="movieList">
          <li class="empty-msg">Waiting for submissions...</li>
        </ul>
        <div class="movie-count" id="movieCount"></div>
        <button id="clearBtn" onclick="clearWheel()">CLEAR WHEEL</button>
      </div>
    </div>

    <div class="wheel-container">
      <canvas id="wheel" width="500" height="500"></canvas>
      <div class="wheel-hub"></div>
      <div class="wheel-pointer"></div>
    </div>
  </div>

  <div class="hint-bar">Press OK on remote to SPIN • Press BACK to dismiss result</div>

  <!-- Result overlay -->
  <div class="result-overlay" id="resultOverlay">
    <h2>*** Tonight's Pick ***</h2>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-hint">Press BACK or OK to continue</div>
  </div>

  <script>
    var canvas = document.getElementById('wheel');
    var ctx = canvas.getContext('2d');
    var RADIUS = 240;
    var CX = canvas.width / 2;
    var CY = canvas.height / 2;

    var COLORS = [
      '#8b0000', '#4a0066', '#1a5200', '#004444',
      '#880033', '#5c3a00', '#003388', '#550000',
      '#330055', '#005500'
    ];

    var ACCENT = '#ff6b00';
    var movies = [];
    var currentAngle = 0;
    var isSpinning = false;
    var spinVelocity = 0;
    var animFrame = null;
    var idleFrame = null;
    var IDLE_SPEED = 0.0008;
    var wsConnected = false;
    var lastMovieCount = -1;

    function startIdleSpin() {
      if (idleFrame) return;
      function idleTick() {
        if (!isSpinning) {
          currentAngle += IDLE_SPEED;
          drawWheel();
        }
        idleFrame = requestAnimationFrame(idleTick);
      }
      idleFrame = requestAnimationFrame(idleTick);
    }

    function stopIdleSpin() {
      if (idleFrame) {
        cancelAnimationFrame(idleFrame);
        idleFrame = null;
      }
    }

    function connectWS() {
      var ws = new WebSocket('wss://' + location.host);
      ws.onopen = function() { wsConnected = true; };
      ws.onmessage = function(e) {
        var data = JSON.parse(e.data);
        if (data.type === 'movies') {
          movies = data.movies;
          updateMovieList();
          if (!isSpinning) drawWheel();
        }
      };
      ws.onclose = function() {
        wsConnected = false;
        setTimeout(connectWS, 3000);
      };
      ws.onerror = function() { wsConnected = false; };
    }

    connectWS();

    setInterval(function() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/movies', true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.length !== lastMovieCount) {
              lastMovieCount = data.length;
              movies = data;
              updateMovieList();
              if (!isSpinning) drawWheel();
            }
          } catch(e) {}
        }
      };
      xhr.onerror = function() {};
      xhr.send();
    }, 2000);

    function updateMovieList() {
      var ul = document.getElementById('movieList');
      var count = document.getElementById('movieCount');
      if (movies.length === 0) {
        ul.innerHTML = '<li class="empty-msg">Waiting for submissions...</li>';
        count.textContent = '';
      } else {
        var html = '';
        for (var i = 0; i < movies.length; i++) {
          html += '<li>> ' + movies[i] + '</li>';
        }
        ul.innerHTML = html;
        count.textContent = movies.length + ' / 10 movies';
      }
    }

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (movies.length === 0) {
        document.querySelector('.wheel-hub').style.display = 'none';
        ctx.beginPath();
        ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#1a0015';
        ctx.fill();
        ctx.strokeStyle = '#ff6b0066';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = '#ff6b0088';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Add movies to spin the wheel!', CX, CY);
        return;
      }

      var slice = (Math.PI * 2) / movies.length;
      document.querySelector('.wheel-hub').style.display = 'block';

      ctx.beginPath();
      ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#1a0015';
      ctx.fill();

      for (var i = 0; i < movies.length; i++) {
        var startAngle = currentAngle + i * slice;
        var endAngle = startAngle + slice;

        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, RADIUS, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
        ctx.strokeStyle = '#ff6b00';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(startAngle + slice / 2);
        var maxLen = 14;
        var label = movies[i].length > maxLen ? movies[i].slice(0, maxLen - 1) + '...' : movies[i];
        var textRadius = RADIUS * 0.62;
        ctx.fillStyle = '#ffeecc';
        ctx.font = 'bold ' + (movies.length > 7 ? '13' : '15') + 'px Arial';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, textRadius, 0);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = ACCENT;
      ctx.lineWidth = 5;
      ctx.stroke();
    }

    function getWinner() {
      if (movies.length === 0) return null;
      var slice = (Math.PI * 2) / movies.length;
      var normalized = ((-currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      var index = Math.floor(normalized / slice) % movies.length;
      return movies[index];
    }

    function spin() {
      if (isSpinning || movies.length < 2) return;
      isSpinning = true;
      stopIdleSpin();
      spinVelocity = 0.22 + Math.random() * 0.13;
      var friction = 0.988 + Math.random() * 0.006;

      function animate() {
        spinVelocity *= friction;
        currentAngle += spinVelocity;
        drawWheel();
        if (spinVelocity > 0.003) {
          animFrame = requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showResult();
          startIdleSpin();
        }
      }
      animFrame = requestAnimationFrame(animate);
    }

    function showResult() {
      var winner = getWinner();
      if (!winner) return;
      document.getElementById('resultTitle').textContent = winner;
      document.getElementById('resultOverlay').classList.add('show');
    }

    function hideResult() {
      document.getElementById('resultOverlay').classList.remove('show');
    }

    function clearWheel() {
      if (isSpinning) return;
      var xhr = new XMLHttpRequest();
      xhr.open('DELETE', '/api/movies', true);
      xhr.send();
    }

    var KEY_OK     = 13;
    var KEY_BACK   = 461;
    var KEY_ESCAPE = 27;

    document.addEventListener('keydown', function(e) {
      var overlay = document.getElementById('resultOverlay');
      var overlayVisible = overlay.classList.contains('show');
      if (overlayVisible) {
        if (e.keyCode === KEY_BACK || e.keyCode === KEY_ESCAPE || e.keyCode === KEY_OK) {
          hideResult();
        }
      } else {
        if (e.keyCode === KEY_OK || e.keyCode === 32) {
          spin();
        }
      }
    });

    drawWheel();
    startIdleSpin();
  </script>
  </script>
</body>
</html>
